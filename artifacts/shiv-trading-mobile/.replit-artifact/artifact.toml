kind = "mobile"
previewPath = "/"
title = "Shiv Trading Agency"
description = "A mobile-first wholesale lubricant catalogue and enquiry app for Shiv Trading Agency in Patna, helping retailers, workshops, fleet operators, and wholesale buyers browse products, request pricing, and contact the business."
version = "1.0.0"
id = "artifacts/shiv-trading-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 20471

[services.development]
run = "pnpm --filter @workspace/shiv-trading-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/shiv-trading-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/shiv-trading-mobile", "run", "serve" ]

[services.env]
PORT = "20471"
BASE_PATH = "/"
